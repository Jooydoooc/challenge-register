name = "course-registration"
main = "worker.js"
compatibility_date = "2026-08-01"

[observability]
enabled = true

[vars]
# Comma-separated list of origins allowed to POST here: exact scheme, host and
# port, no trailing slash, exact match only.
# This must equal the Pages URL the form is served from. Preview deployments
# get their own hostname and will NOT match, so their forms will fail.
# Add http://localhost:8000 temporarily if you need to test locally.
ALLOWED_ORIGIN = "https://challenge-register.pages.dev"

# Created with:  wrangler kv namespace create RATELIMIT
# Paste the returned id below. `wrangler deploy` fails with an invalid id, so do
# this before deploying. Removing this block deploys fine but turns rate
# limiting off entirely.
[[kv_namespaces]]
binding = "RATELIMIT"
id = "f7acffb8f638484b936a4a4ed6889b86"
# Only needed for `wrangler dev --remote`:
# preview_id = "PASTE_PREVIEW_ID_HERE"

# Secrets are NOT set here. Run:
#   wrangler secret put BOT_TOKEN
#   wrangler secret put CHAT_ID
